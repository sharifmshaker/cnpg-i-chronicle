apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: chronicle-client
  namespace: cnpg-system
spec:
  secretName: chronicle-client-tls
  commonName: chronicle-client
  duration: 2160h
  renewBefore: 360h
  isCA: false
  usages:
    - client auth
  issuerRef:
    name: chronicle-selfsigned-issuer
    kind: Issuer
    group: cert-manager.io
