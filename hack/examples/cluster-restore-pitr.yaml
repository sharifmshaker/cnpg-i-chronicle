# Align the restored configuration with the cluster's own recovery target.
#
# Restoring data to last Tuesday and then applying today's configuration gives a
# cluster that never existed. AlignWithRecoveryTarget reads the Cluster's
# bootstrap.recovery stanza and picks the configuration that was in force at the
# moment the data corresponds to — no timestamp to copy by hand, and no way for
# the two to drift apart.
apiVersion: chronicle.sharifmshaker.github.io/v1
kind: RestorePolicy
metadata:
  name: aligned-with-pitr
spec:
  select:
    mode: AlignWithRecoveryTarget
    # Fail (the default) refuses the cluster when the recovery target cannot be
    # mapped to a moment. UseLatest accepts the newest configuration instead.
    onUnresolvable: Fail
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg-pitr
spec:
  instances: 3
  storage:
    size: 10Gi

  bootstrap:
    recovery:
      source: origin
      recoveryTarget:
        targetTime: "2026-08-25T11:30:00Z"

  externalClusters:
    - name: origin
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: backup-store
          serverName: pg-prod

  plugins:
    - name: chronicle.sharifmshaker.github.io
      parameters:
        restoreFromStore: config-store
        restoreFromServer: pg-prod
        restorePolicy: aligned-with-pitr
