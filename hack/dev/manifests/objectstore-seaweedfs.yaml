# SeaweedFS — the alternative object store, selected with DEV_S3=seaweedfs.
#
# It exists as a hedge. RustFS is the default because the CloudNativePG
# playground uses it, but RustFS has no stable 1.0 yet. SeaweedFS is Apache-2.0,
# cuts stable releases, and is the most actively maintained of the post-MinIO
# options — so if a RustFS release candidate misbehaves, the environment moves
# with one variable rather than a rewrite.
#
# `weed server -s3` runs master, volume, filer and the S3 gateway in one
# process, which is what makes this a single pod.
apiVersion: v1
kind: Secret
metadata:
  name: "${DEV_S3_SERVICE}"
  namespace: "${DEV_NAMESPACE}"
type: Opaque
stringData:
  ACCESS_KEY_ID: "${DEV_ACCESS_KEY}"
  ACCESS_SECRET_KEY: "${DEV_SECRET_KEY}"
---
# SeaweedFS takes S3 credentials from a JSON identities file, not env vars.
apiVersion: v1
kind: ConfigMap
metadata:
  name: "${DEV_S3_SERVICE}-s3-config"
  namespace: "${DEV_NAMESPACE}"
data:
  s3.json: |
    {
      "identities": [
        {
          "name": "${DEV_ACCESS_KEY}",
          "credentials": [
            {
              "accessKey": "${DEV_ACCESS_KEY}",
              "secretKey": "${DEV_SECRET_KEY}"
            }
          ],
          "actions": ["Admin", "Read", "Write", "List", "Tagging"]
        }
      ]
    }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: "${DEV_S3_SERVICE}"
  namespace: "${DEV_NAMESPACE}"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "${DEV_S3_SERVICE}"
  namespace: "${DEV_NAMESPACE}"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: "${DEV_S3_SERVICE}"
  template:
    metadata:
      labels:
        app: "${DEV_S3_SERVICE}"
    spec:
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - operator: Exists
      containers:
        - name: seaweedfs
          image: "${DEV_S3_IMAGE}"
          args:
            - server
            - -dir=/data
            - -s3
            - -s3.port=9000
            - -s3.config=/etc/seaweedfs/s3.json
            - -master.volumeSizeLimitMB=256
            - -volume.max=0
          ports:
            - name: s3
              containerPort: 9000
            # SeaweedFS has no S3 console; its filer UI stands in, so the same
            # host port means "browse the store" whichever backend is running.
            - name: console
              containerPort: 8888
          readinessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 3
          livenessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /etc/seaweedfs
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: "${DEV_S3_SERVICE}"
        - name: config
          configMap:
            name: "${DEV_S3_SERVICE}-s3-config"
---
apiVersion: v1
kind: Service
metadata:
  name: "${DEV_S3_SERVICE}"
  namespace: "${DEV_NAMESPACE}"
spec:
  type: NodePort
  selector:
    app: "${DEV_S3_SERVICE}"
  ports:
    - name: s3
      port: 9000
      targetPort: 9000
      nodePort: 30900
    - name: console
      port: 9001
      targetPort: 8888
      nodePort: 30901
