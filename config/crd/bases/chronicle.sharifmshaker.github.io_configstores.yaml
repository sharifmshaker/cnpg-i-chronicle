---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: configstores.chronicle.sharifmshaker.github.io
spec:
  group: chronicle.sharifmshaker.github.io
  names:
    kind: ConfigStore
    listKind: ConfigStoreList
    plural: configstores
    shortNames:
    - mdstore
    - mdstores
    singular: configstore
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.resolved.destinationPath
      name: Destination
      type: string
    - jsonPath: .status.resolved.source
      name: Source
      type: string
    - jsonPath: .status.resolved.retention
      name: Retention
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: |-
          ConfigStore is where a cluster's configuration snapshots are kept. It can
          derive its backing object store from a barman-cloud ObjectStore, so snapshots
          land in the same bucket as backups, or define one itself.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ConfigStoreSpec defines where cluster configuration snapshots are stored.

              Exactly one of derivedFrom or configuration must be set. derivedFrom lets the
              store piggyback on an object store that is already configured for backups;
              configuration lets it stand alone, so the plugin is usable without the
              barman-cloud plugin installed.
            properties:
              captureGroups:
                description: |-
                  CaptureGroups selects which capture groups are written into snapshots
                  stored here. Empty means the default set.

                  Two groups are defined but off by default, because they are correct to
                  restore in some topologies and actively harmful in others:

                    Identity  postgresUID, postgresGID, serviceAccountName
                    Secrets   certificates, superuserSecret, enableSuperuserAccess

                  Naming any group here replaces the default set rather than adding to it,
                  so list every group you want. `kubectl explain` cannot enumerate them;
                  an unknown name is rejected in status with the valid list.

                  This is per-store rather than per-cluster on purpose: every snapshot in
                  one store then has the same shape, so a restore reading them does not
                  have to reason about which fields a given snapshot could contain.

                  Changing this re-captures every cluster writing here, once: the effective
                  groups and the rules they capture under are part of the metadata
                  fingerprint, so the watermarks that would otherwise short-circuit capture
                  no longer match.
                items:
                  type: string
                type: array
              configuration:
                description: |-
                  Configuration is a self-contained object store definition, scoped to what
                  this plugin actually uses. Credential field names match barman-cloud's, so
                  that block can be copied across from a backup configuration unchanged.

                  There is no serverName here: one store serves many clusters, and the
                  per-cluster server name comes from the plugin's serverName parameter.
                properties:
                  destinationPath:
                    description: |-
                      DestinationPath is the object store root, for example s3://backups/ or
                      s3://backups/some/prefix.

                      The pattern admits only s3:// today. Widening it to azure:// or gs:// when
                      those backends land is backward compatible; narrowing would not be, which
                      is why it starts strict.
                    minLength: 1
                    pattern: ^s3://.+
                    type: string
                  endpointCA:
                    description: |-
                      EndpointCA is a Secret key holding a PEM bundle for an endpoint serving a
                      private TLS certificate.
                    properties:
                      key:
                        description: The key to select
                        type: string
                      name:
                        description: Name of the referent.
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  endpointURL:
                    description: |-
                      EndpointURL points at a self-hosted S3-compatible endpoint, such as
                      RustFS. Leave it unset for AWS S3 itself.

                      Setting it also switches the client to path-style addressing, which
                      self-hosted endpoints require: virtual-host addressing needs per-bucket
                      DNS they do not provide.
                    type: string
                  s3Credentials:
                    description: |-
                      S3Credentials authenticates to an S3-compatible store.

                      Optional in the schema so that a sibling credential type can be added
                      without changing this field. The exactly-one-of rule on the enclosing type
                      is what makes it effectively required today.
                    properties:
                      accessKeyId:
                        description: AccessKeyID is a Secret key holding the access
                          key id.
                        properties:
                          key:
                            description: The key to select
                            type: string
                          name:
                            description: Name of the referent.
                            type: string
                        required:
                        - key
                        - name
                        type: object
                      inheritFromIAMRole:
                        description: |-
                          InheritFromIAMRole takes credentials from the ambient chain — IRSA, an
                          instance profile — instead of from Secrets.
                        type: boolean
                      region:
                        description: |-
                          Region is a Secret key holding the region. Most S3-compatible endpoints
                          ignore it; AWS does not.
                        properties:
                          key:
                            description: The key to select
                            type: string
                          name:
                            description: Name of the referent.
                            type: string
                        required:
                        - key
                        - name
                        type: object
                      secretAccessKey:
                        description: SecretAccessKey is a Secret key holding the secret
                          access key.
                        properties:
                          key:
                            description: The key to select
                            type: string
                          name:
                            description: Name of the referent.
                            type: string
                        required:
                        - key
                        - name
                        type: object
                      sessionToken:
                        description: |-
                          SessionToken is a Secret key holding a session token, for temporary
                          credentials.
                        properties:
                          key:
                            description: The key to select
                            type: string
                          name:
                            description: Name of the referent.
                            type: string
                        required:
                        - key
                        - name
                        type: object
                    type: object
                    x-kubernetes-validations:
                    - message: set inheritFromIAMRole, or supply both accessKeyId
                        and secretAccessKey
                      rule: (has(self.inheritFromIAMRole) && self.inheritFromIAMRole)
                        || (has(self.accessKeyId) && has(self.secretAccessKey))
                required:
                - destinationPath
                type: object
                x-kubernetes-validations:
                - message: exactly one credential block must be set; s3Credentials
                    is currently the only supported kind
                  rule: has(self.s3Credentials)
              derivedFrom:
                description: |-
                  DerivedFrom resolves the backing configuration from an existing barman-cloud
                  ObjectStore rather than restating it here.
                properties:
                  name:
                    description: |-
                      Name of a barmancloud.cnpg.io/v1 ObjectStore in the same namespace as this
                      ConfigStore. Only its .spec.configuration is consumed; barman-owned fields
                      such as retentionPolicy and instanceSidecarConfiguration are ignored.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              prefix:
                default: chronicle
                description: |-
                  Prefix is the key prefix, relative to <destinationPath>/<serverName>/, under
                  which snapshots are written.
                pattern: ^[a-zA-Z0-9][a-zA-Z0-9._-]*$
                type: string
                x-kubernetes-validations:
                - message: prefix must not collide with barman-cloud's 'base' or 'wals'
                    directories
                  rule: self != 'base' && self != 'wals'
              retention:
                description: |-
                  Retention is how far back a restore must still be able to reach.

                  This is a guarantee, not a deletion window. "30d" means "any restore
                  target within the last 30 days must resolve", and honouring it can mean
                  keeping a snapshot that is a year old: snapshots are written only when
                  configuration changes, so the newest snapshot at or before the window's
                  start may be very old, and it is the answer to every query back to that
                  point. Deleting it would leave those restores with nothing to select.

                  Only superseded history is removed — snapshots older than that anchor,
                  which no target inside the window could ever select. A cluster that has
                  not changed in a year keeps its single snapshot forever.

                  Values:

                    Forever                  never delete anything. The default.
                    30d, 4w, 6m              an explicit window
                    InheritFromObjectStore   follow retentionPolicy on the barman
                                             ObjectStore this store derives from

                  Targets older than the window still resolve, but to the oldest retained
                  configuration, which may be later than the one actually in force then. In
                  practice that is moot: backup retention means there is no data to pair an
                  older configuration with.

                  Enforcement needs s3:DeleteObject. Without it, deletions are logged and
                  skipped: the store keeps capturing and restoring rather than going
                  NotReady over disk usage.
                pattern: ^(Forever|InheritFromObjectStore|[1-9][0-9]*[dwm])$
                type: string
            type: object
            x-kubernetes-validations:
            - message: exactly one of derivedFrom or configuration must be set
              rule: has(self.derivedFrom) != has(self.configuration)
          status:
            description: ConfigStoreStatus defines the observed state of ConfigStore.
            properties:
              conditions:
                description: Conditions represent the latest available observations.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              resolved:
                description: Resolved is the backing configuration currently in effect.
                properties:
                  captureGroups:
                    description: |-
                      CaptureGroups is the group set snapshots here are actually written with,
                      with "empty means the default set" already resolved. Reported because the
                      default is otherwise invisible: an empty spec.captureGroups says nothing
                      about what is being captured.
                    items:
                      type: string
                    type: array
                  destinationPath:
                    description: DestinationPath is the object store root, e.g. s3://backups/
                    type: string
                  endpointURL:
                    description: EndpointURL is the S3-compatible endpoint, when one
                      is configured.
                    type: string
                  observedAt:
                    description: ObservedAt is when the configuration was last resolved.
                    format: date-time
                    type: string
                  provider:
                    description: 'Provider is the detected credential provider: s3,
                      azure or google.'
                    type: string
                  retention:
                    description: |-
                      Retention is the effective retention, with Forever and
                      InheritFromObjectStore already resolved to what is enforced. Reported
                      because neither is legible from the spec alone.
                    type: string
                  source:
                    description: |-
                      Source records where the configuration came from: "Inline", or
                      "ObjectStore/<name>" when derived.
                    type: string
                type: object
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
